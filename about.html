<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درباره سازنده | حالِ خوب من</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C5CE7; --secondary: #00CEC9; --accent: #FD79A8;
            --bg: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            --glass: rgba(255, 255, 255, 0.25); --border: rgba(255, 255, 255, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); min-height: 100vh; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .back-btn { position: absolute; top: 20px; right: 20px; text-decoration: none; color: white; background: var(--glass); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.4); }
        
        .glass-box { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 25px; padding: 40px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        
        .creator-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid var(--secondary); margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.25); }
        h2 { font-size: 1.8rem; margin-bottom: 10px; color: #fff; }
        h3 { font-size: 1.3rem; color: var(--secondary); margin-bottom: 15px; }
        p { font-size: 1.05rem; line-height: 1.8; opacity: 0.95; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> بازگشت به خانه</a>

    <div class="glass-box">
        <img src="parinaz.jpg" alt="پریناز" class="creator-img" onerror="this.src='https://via.placeholder.com/150'">
        <h2>طراح و توسعه‌دهنده پروژه</h2>
        <h3>پریناز نادری</h3>
        <p>دانش‌آموز پایه نهم | طراح و سازنده وب‌سایت جامع سلامت روان</p>
        <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 15px;">این وب‌سایت با هدف ارتقای بهداشت روان، تقویت تاب‌آوری و ایجاد فضایی امن و صمیمی برای دانش‌آموزان به مناسبت هفته سلامت روان خلق شده است. 🌸✨</p>
    </div>

</body>
</html>
