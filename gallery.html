<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری و ثبت اثر</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C5CE7; --secondary: #00CEC9; --accent: #FD79A8;
            --bg: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            --glass: rgba(255, 255, 255, 0.25); --border: rgba(255, 255, 255, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); min-height: 100vh; color: white; padding: 20px; }
        
        nav {
            max-width: 1100px; margin: 10px auto 30px auto; background: var(--glass);
            backdrop-filter: blur(16px); border: 1px solid var(--border);
            border-radius: 20px; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
        .logo i { color: var(--secondary); }
        .nav-links { display: flex; list-style: none; gap: 10px; }
        .nav-links a { text-decoration: none; color: white; font-weight: 500; padding: 8px 14px; border-radius: 12px; transition: 0.3s; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.3); }
        .cta-btn { background: linear-gradient(45deg, var(--primary), var(--accent)); font-weight: 700 !important; }

        .container { max-width: 1000px; margin: 0 auto; }
        .glass-box { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .art-card { background: rgba(0,0,0,0.2); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
        .art-card img { width: 100%; height: 180px; object-fit: cover; }
        .art-info { padding: 15px; }

        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: none; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <!-- منوی بالا همراه با لینک بازگشت به خانه -->
    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-heart-pulse"></i><span>حالِ خوب من</span></a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> خانه</a></li>
            <li><a href="gallery.html" class="active"><i class="fa-solid fa-palette"></i> گالری</a></li>
            <li><a href="mood.html" class="cta-btn"><i class="fa-solid fa-smile"></i> حالت چطوره؟</a></li>
            <li><a href="about.html"><i class="fa-solid fa-user"></i> سازنده و پنل</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- فرم آپلود -->
        <div class="glass-box">
            <h3 style="margin-bottom: 15px;">📤 آپلود نقاشی یا تصویر هوش مصنوعی شما</h3>
            <form id="upForm" onsubmit="uploadArt(event)">
                <input type="text" id="title" placeholder="عنوان اثر" required>
                <input type="text" id="author" placeholder="نام شما (پدیدآورنده)" required>
                <select id="type">
                    <option value="🎨 نقاشی دستی">🎨 نقاشی دستی / دیجیتال</option>
                    <option value="🤖 تصویر هوش مصنوعی">🤖 تصویر هوش مصنوعی</option>
                </select>
                <input type="file" id="file" accept="image/*" required style="color: white;">
                <button type="submit">ثبت و اضافه شدن به گالری ✨</button>
            </form>
        </div>

        <!-- شبکه‌بندی عکس‌ها -->
        <h2>گالری آثار ثبت شده</h2>
        <div id="artGrid" class="grid" style="margin-top: 15px;">
            <div class="art-card">
                <img src="https://picsum.photos/400/300?random=1">
                <div class="art-info">
                    <span style="background: var(--accent); padding: 3px 8px; border-radius: 5px; font-size: 0.8rem;">🎨 نقاشی</span>
                    <h4 style="margin-top: 8px;">امید در مدرسه</h4>
                    <p style="font-size: 0.85rem; opacity: 0.8;">پدیدآورنده: پریناز</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function uploadArt(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const type = document.getElementById('type').value;
            const file = document.getElementById('file').files[0];

            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const grid = document.getElementById('artGrid');
                    const card = document.createElement('div');
                    card.className = 'art-card';
                    card.innerHTML = `
                        <img src="${evt.target.result}">
                        <div class="art-info">
                            <span style="background: var(--secondary); color:#000; padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; font-weight:bold;">${type}</span>
                            <h4 style="margin-top: 8px;">${title}</h4>
                            <p style="font-size: 0.85rem; opacity: 0.8;">پدیدآورنده: ${author}</p>
                        </div>
                    `;
                    grid.prepend(card);
                    alert('✨ اثر شما با موفقیت در گالری اضافه شد!');
                    document.getElementById('upForm').reset();
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
